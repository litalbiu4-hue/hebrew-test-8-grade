<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מתכוננים למבחן בעברית – כיתה ח'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f8; --card:#fffefc; --ink:#1f2535; --muted:#5d6478; --line:#dbe1ec;
  --brand:#2457a6; --brand-soft:#e2eaf8; --ok:#1f8a4c; --ok-soft:#dff3e6;
  --bad:#c0392b; --bad-soft:#fbe3df; --warn:#9a6a10; --warn-soft:#fdf0d5;
  --easy:#2f9e6b; --mid:#d98a1c; --hard:#c4453a; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:20px 14px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:28px;margin:0;font-weight:800}
.sub{color:var(--muted);margin:4px 0 0;font-size:16px}
.chip-date{background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.howto{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;font-size:16px}
.section-title{font-size:15px;font-weight:700;color:var(--muted);margin:22px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.topic .t-head{display:flex;gap:10px;align-items:center}
.topic .icon{font-size:26px;width:46px;height:46px;display:grid;place-items:center;background:var(--brand-soft);border-radius:12px;flex:none}
.topic h3{margin:0;font-size:19px;line-height:1.25}
.topic p{margin:0;color:var(--muted);font-size:14.5px}
.levels{display:flex;gap:8px;margin-top:auto}
.lvl{flex:1;border:0;border-radius:12px;padding:9px 4px 7px;font:inherit;font-size:15px;font-weight:700;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.lvl.l0{background:var(--easy)} .lvl.l1{background:var(--mid)} .lvl.l2{background:var(--hard)}
.lvl .stars{font-size:12px;letter-spacing:1px;min-height:16px}
.exbtn{border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:12px;padding:7px 10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.exbtn:hover{background:var(--brand-soft)}
.bigbtn{display:block;width:100%;border:0;border-radius:var(--radius);padding:16px;font:inherit;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2457a6,#6b3fa0);cursor:pointer}
.resetall{margin-top:26px;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.qtitle{font-weight:700;font-size:17px;flex:1}
.badge{border-radius:999px;padding:3px 10px;color:#fff;font-size:13px;font-weight:700;margin-inline-start:6px}
.badge.l0{background:var(--easy)} .badge.l1{background:var(--mid)} .badge.l2{background:var(--hard)} .badge.l3{background:#6b3fa0}
.progress{height:10px;background:#d9e0ec;border-radius:999px;overflow:hidden;margin-bottom:16px}
.progress>div{height:100%;background:var(--brand);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.qnum{color:var(--muted);font-size:14px;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtype{background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:1px 9px;font-size:13px;font-weight:700}
.qtext{font-size:20px;font-weight:500;margin-bottom:14px}
.qtext b,.qtext u{color:#8a2a1e}
.quote{background:#f6f8fc;border-right:4px solid var(--brand);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-family:"Frank Ruhl Libre",serif;font-size:20px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 16px;font:inherit;font-size:18px;cursor:pointer;text-align:start}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
textarea.ans,input.ans{width:100%;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff}
textarea.ans{min-height:110px;resize:vertical}
textarea.ans:focus,input.ans:focus{outline:none;border-color:var(--brand)}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 20px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:14px;border-radius:14px;padding:12px 16px;font-size:17px}
.fb.ok{background:var(--ok-soft);color:#14532d}
.fb.bad{background:var(--bad-soft);color:#7f1d1d}
.fb.warn{background:var(--warn-soft);color:#713f12}
.fb .model{margin-top:6px}
.fb ul{margin:6px 0 0;padding-inline-start:20px}
.reading{background:#fbfaf6;border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:16px;font-family:"Frank Ruhl Libre",serif;font-size:19px;line-height:1.75}
.reading h4{margin:0 0 6px;font-family:"Rubik";font-size:20px}
.reading p{margin:8px 0}
.reading .pn{font-family:"Rubik";font-size:13px;color:#fff;background:var(--brand);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
details.rt summary{cursor:pointer;color:var(--brand);font-weight:700;margin-bottom:8px}
/* order */
.olist{display:grid;gap:8px}
.oitem{border:2px solid #c9d6ee;background:#f4f7fd;border-radius:12px;padding:10px 14px;font:inherit;font-size:17px;cursor:pointer;text-align:start}
.oitem.used{display:none}
.ozone{min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:grid;gap:8px;margin-bottom:10px;background:#fff}
.ozone .oitem{background:#fff}
.ozone .oitem .n{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;width:24px;height:24px;text-align:center;font-size:14px;line-height:24px;margin-left:8px}
.ozone .oitem.ok{border-color:var(--ok);background:var(--ok-soft)} .ozone .oitem.bad{border-color:var(--bad);background:var(--bad-soft)}
/* explain */
.ex-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.ex-head h2{margin:0;font-size:24px;flex:1}
.ex-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0}
.ex-sec h3{margin:0 0 8px;font-size:19px;color:var(--brand)}
.ex-sec p{margin:6px 0}
.ex-sec ul,.ex-sec ol{margin:6px 0;padding-inline-start:22px}
.ex-sec li{margin:4px 0}
.key{background:var(--warn-soft);border-right:4px solid var(--mid);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:500}
.ex{background:#f6f8fc;border-radius:10px;padding:10px 14px;margin:8px 0;font-family:"Frank Ruhl Libre",serif;font-size:19px}
.ex .h{background:#fff2b8;border-radius:4px;padding:0 3px}
table.rt{width:100%;border-collapse:collapse;margin:8px 0;font-size:16.5px}
table.rt th,table.rt td{border:1px solid var(--line);padding:6px 8px;text-align:start;vertical-align:top}
table.rt th{background:var(--brand-soft)}
.ex-start{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:50}
.modal .inner{background:var(--bg);border-radius:18px;max-width:860px;width:100%;padding:18px}
.sum{text-align:center}
.sum .score{font-size:56px;font-weight:800;margin:6px 0}
.sum .bigstars{font-size:40px;letter-spacing:6px}
.mist{text-align:start;margin-top:18px}
.mist li{margin-bottom:6px}
@media (max-width:520px){ body{font-size:17px} h1{font-size:23px} .qtext{font-size:18.5px} .card{padding:15px} .reading{font-size:18px;padding:10px 14px} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ================= עזרים ================= */
const $=(s,el=document)=>el.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const LS="heb8_progress_v1";
function loadProg(){try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return {};}}
function saveProg(p){try{localStorage.setItem(LS,JSON.stringify(p));}catch(e){}}
const norm=s=>String(s).replace(/[֑-ׇ]/g,"").replace(/[.,!?;:"'״׳()\-–]/g," ").replace(/\s+/g," ").trim();

/* question builders */
const mc=(q,o,ex,extra={})=>Object.assign({t:"mc",q,o,ex},extra);
const open=(q,keys,need,model,ex,extra={})=>Object.assign({t:"open",q,keys,need,model,ex},extra);

/* =========================================================
   הבנת הנקרא – טקסטים
   ========================================================= */
const TX=[
{title:"למה מתבגרים מתקשים לקום בבוקר?",kind:"טקסט מידעי",paras:[
 "הורים רבים מתלוננים שילדיהם המתבגרים הולכים לישון מאוחר ומתקשים לקום בבוקר. לעיתים קרובות הם מייחסים זאת לעצלות או לשימוש מופרז בטלפון. אולם המחקר מלמד שהסיבה מורכבת יותר.",
 "בגוף האדם פועל \"שעון ביולוגי\" – מנגנון פנימי המווסת את מחזור השינה והערות. אחד הכלים של השעון הזה הוא הורמון בשם מלטונין, המופרש בשעות הערב ומאותת לגוף שהגיע הזמן לישון. בגיל ההתבגרות הפרשת המלטונין מתחילה מאוחר יותר מאשר אצל ילדים ומבוגרים, ולכן מתבגרים אינם מרגישים עייפים בשעה שבה הוריהם כבר מפהקים.",
 "מומחים ממליצים שבני נוער יישנו בין שמונה לעשר שעות בלילה. ואולם, מכיוון שהם נרדמים מאוחר ונדרשים לקום מוקדם לבית הספר, רבים מהם ישנים פחות משבע שעות. מחסור מתמשך בשינה עלול לפגוע בריכוז, בזיכרון ובמצב הרוח, ואף להגביר את הסיכון לתאונות.",
 "גם המסכים תורמים לבעיה: האור הכחול הנפלט מהטלפון ומהמחשב מעכב את הפרשת המלטונין, ובכך דוחה עוד יותר את שעת ההירדמות. לכן מומלץ להניח את הטלפון בצד כשעה לפני השינה.",
 "בעקבות ממצאים אלה, בכמה מקומות בעולם הוחלט להתחיל את יום הלימודים מאוחר יותר. לפי דיווחים מחלק מבתי הספר האלה, התלמידים איחרו פחות ונראו ערניים יותר בשיעורים. עם זאת, השינוי אינו פשוט: הוא מחייב שינוי בהסעות, בשעות העבודה של ההורים ובפעילויות של אחר הצהריים."
],qs:[
 mc("מהו מלטונין, לפי הטקסט?",["הורמון שמאותת לגוף שהגיע הזמן לישון","שעון שמעיר את הגוף בבוקר","אור כחול שנפלט מהטלפון","תרופה נגד עייפות"],"התשובה מופיעה במפורש בפסקה 2.",{type:"איתור מידע"}),
 open("כמה שעות שינה מומלצות לבני נוער?",["שמונה|8","עשר|10"],2,"מומלץ שבני נוער יישנו בין שמונה לעשר שעות בלילה.","פסקה 3, המשפט הראשון.",{type:"איתור מידע"}),
 open("ציינו שתי פגיעות שעלולות להיגרם בגלל מחסור מתמשך בשינה.",["ריכוז","זיכרון|זכרון","מצב הרוח|מצב רוח","תאונ"],2,"מחסור בשינה עלול לפגוע בריכוז ובזיכרון (וגם במצב הרוח, ולהגביר את הסיכון לתאונות).","בפסקה 3 יש ארבע פגיעות – מספיק לציין שתיים.",{type:"איתור מידע"}),
 mc("מה פירוש המילה <u>מווסת</u> בפסקה 2?",["מסדיר ושולט","מבטל","מאריך","מפריע"],"מנגנון \"המווסת את מחזור השינה\" – כלומר קובע ומסדיר אותו.",{type:"אוצר מילים מתוך הקשר"}),
 mc("מה פירוש המילה <u>מתמשך</u> בפסקה 3?",["נמשך זמן רב","קורה פעם אחת","קטן מאוד","מפתיע"],null,{type:"אוצר מילים מתוך הקשר"}),
 mc("לפי פסקה 1, במה טועים לעיתים ההורים?",["הם חושבים שהסיבה היא עצלות, אבל יש לה גם סיבה ביולוגית","הם חושבים שמתבגרים ישנים יותר מדי","הם אוסרים על ילדיהם להשתמש בטלפון","הם קמים מאוחר מדי"],"המילה \"אולם\" מסמנת ניגוד: ההורים חושבים כך – אך המחקר מלמד אחרת.",{type:"פרשנות והיסק"}),
 mc("נועה גולשת בטלפון עד חצות. מה אפשר להסיק מפסקה 4?",["היא תירדם מאוחר עוד יותר","היא תירדם מהר יותר","האור הכחול יעזור לה להירדם","זה לא ישפיע על השינה שלה"],"האור הכחול מעכב את המלטונין ← ההירדמות נדחית. זו מסקנה שלא כתובה במפורש – היסק.",{type:"פרשנות והיסק"}),
 mc("מדוע מתבגרים אינם מרגישים עייפים בשעה שבה הוריהם כבר מפהקים?",["כי המלטונין שלהם מופרש מאוחר יותר","כי הם שותים קפה","כי הם ישנו בצהריים","כי הם צעירים וחזקים יותר"],null,{type:"איתור מידע"}),
 mc("מה תפקיד הצירוף <u>עם זאת</u> בפסקה 5?",["להציג הסתייגות – הפתרון טוב, אבל יש בו קשיים","להוסיף עוד יתרון","לסכם את הטקסט","להביא דוגמה"],"\"עם זאת\" הוא קשר של ויתור/ניגוד – הכותב מציג את הצד השני.",{type:"הערכה וביקורת"}),
 mc("מהי המטרה העיקרית של הטקסט?",["להסביר מדוע מתבגרים מתקשים לקום ולהציג דרכים לטפל בכך","לשכנע הורים להעניש ילדים שקמים מאוחר","לספר סיפור על נער עייף","לפרסם טלפון חדש"],"טקסט מידעי – מסביר סיבות ומציג פתרונות.",{type:"הערכה וביקורת"}),
 mc("מה תפקידה של הפסקה הראשונה?",["להציג את הבעיה ואת ההסבר הנפוץ שהטקסט יראה שאינו מלא","לסכם את כל הממצאים","להציג פתרון","להגדיר מהו מלטונין"],null,{type:"הערכה וביקורת"}),
 open("לפי פסקה 5, מדוע קשה להזיז את שעת תחילת הלימודים? ציינו סיבה אחת.",["הסעות|הסעה","עבודה|הורים","אחר הצהריים|פעילויות|חוגים"],1,"כי צריך לשנות את ההסעות (וגם את שעות העבודה של ההורים ואת הפעילויות של אחר הצהריים).",null,{type:"איתור מידע"}),
]},
{title:"טלפונים בבית הספר – כן או לא?",kind:"טקסט טיעוני (מאמר דעה של תלמידה)",paras:[
 "לאחרונה הוחלט בבית ספרנו לאסור את השימוש בטלפונים ניידים במהלך יום הלימודים. אני סבורה שזו החלטה נכונה ונחוצה.",
 "ראשית, הטלפון מסיח את הדעת. די בהתראה אחת כדי לנתק תלמיד מהשיעור, וקשה מאוד לחזור לריכוז מלא אחרי הפרעה. כאשר הטלפון נמצא בתיק סגור, הפיתוי קטן בהרבה.",
 "שנית, ההפסקות הפכו שקטות מדי. במקום לשחק בחצר או לשוחח, תלמידים רבים יושבים כל אחד מול המסך שלו. האיסור מחזיר את המפגש האמיתי בין חברים – את המשחק, הצחוק והשיחה.",
 "יתרה מזאת, האיסור עשוי לצמצם תופעות של חרם והצקות ברשתות החברתיות, שחלקן מתרחשות בזמן הלימודים עצמו.",
 "אמנם יש הטוענים שהטלפון הוא כלי לימודי חשוב, ושבעזרתו אפשר לחפש מידע במהירות. אולם בבית הספר יש מחשבים וספרייה, והמורים יכולים להתיר שימוש בטלפון בשיעור מסוים כשיש בכך צורך.",
 "לסיכום, האיסור אינו עונש אלא הזדמנות: להקשיב טוב יותר, להיפגש באמת ולהרגיש בטוחים יותר. כדאי שבתי ספר נוספים ילכו בדרך זו."

 ref:()=>SEC("מה זה מאזכר?",`<p><b>מאזכר</b> הוא מילה או צירוף שמפנים לדבר שכבר הוזכר בטקסט – כדי לא לחזור על אותה מילה, וכדי לחבר בין המשפטים.</p>

   ${KEY("\"<b>הראשון</b>\" = הדבר הראשון שהוזכר. \"<b>האחרון</b>\" = הדבר האחרון שהוזכר. רונית סיפרה לגלית, ו<b>זו</b> הבטיחה... ← \"זו\" = האחרונה שהוזכרה = גלית.")}`),
 cmp:()=>SEC("מבנה פסקת השוואה",`<ol><li><b>משפט פתיחה:</b> מה משווים (שני הדברים) ולפי אילו <b>היבטים</b>.</li><li><b>גוף:</b> לכל היבט – מה דומה ומה שונה.</li>

   <tr><td>בדומה ל, כמו, גם... וגם, שניהם, באותו אופן, כשם ש... כך</td><td>לעומת, לעומת זאת, ואילו, בניגוד ל, אך, אולם, לעומת... </td></tr></table>`)+
  SEC("פסקה לדוגמה",CMP_PAR.map((s,i)=>`<div class="ex">${["🟦 פתיחה","🟩 היבט 1","🟩 היבט 2","🟨 דמיון","🟥 סיכום"][i]} – ${s}</div>`).join(""))+
  SEC("שני סוגי מבנה",`<ul><li><b>לפי היבטים</b> (כמו בדוגמה): מחיר – שניהם; נוחות – שניהם. ← <b>מומלץ!</b></li><li><b>לפי נושאים:</b> קודם כל על הספר המודפס, אחר כך על הדיגיטלי.</li></ul>`),
 opi:()=>SEC("מבנה פסקת הבעת עמדה",`<table class="rt"><tr><th>חלק</th><th>מה כותבים</th><th>מילים שעוזרות</th></tr>
   <tr><td>🟦 <b>עמדה</b></td><td>מה אני חושב/ת – ברור וחד</td><td>לדעתי, אני סבור/ה, אני בעד / נגד</td></tr>
   <tr><td>🟩 <b>נימוק 1</b></td><td>למה? + הסבר</td><td>ראשית, כי, מפני ש</td></tr>

   <tr><td>🟨 <b>טענת נגד והפרכה</b></td><td>מה אומרים המתנגדים – ולמה הם טועים</td><td>אמנם יש הטוענים ש... אולם; אף על פי ש...</td></tr>
   <tr><td>🟥 <b>סיכום</b></td><td>חזרה על העמדה במילים אחרות</td><td>לסיכום, לכן, אם כן</td></tr></table>
   ${KEY("זוכרים בעזרת <b>ע-נ-נ-ט-ס</b>: <b>ע</b>מדה, <b>נ</b>ימוק, <b>נ</b>ימוק, <b>ט</b>ענת נגד, <b>ס</b>יכום.")}`)+
  SEC("פסקה לדוגמה",OPI_PAR.map((s,i)=>`<div class="ex">${["🟦 עמדה","🟩 נימוק 1","🟩 נימוק 2","🟨 טענת נגד והפרכה","🟥 סיכום"][i]} – ${s}</div>`).join(""))+
  SEC("מה עושה נימוק לטוב?",`<ul><li>הוא <b>קשור</b> לעמדה ומסביר אותה.</li><li>הוא <b>כללי</b> – נכון לרבים, לא רק \"כי אני אוהב\".</li><li>יש לו <b>הסבר או דוגמה</b>.</li></ul>`),
 poss:()=>SEC("פרוד וחבור",`<p><b>פרוד</b> – השייכות במילה נפרדת: <b>הספר שלי</b>. <b>חבור</b> – השייכות מחוברת לסוף המילה: <b>ספרי</b>.</p>
   ${KEY("ממיר: מורידים את <b>ה' הידיעה</b> ואת <b>\"של\"</b>, ומדביקים את הסוף של \"שלי/שלו/שלנו\" לסוף המילה: הספר של<b>ו</b> ← ספר<b>ו</b>.")}`)+
  SEC("טבלה – שם עצם ביחיד וברבים",`<table class="rt"><tr><th>גוף</th><th>פרוד</th><th>ספר (יחיד)</th><th>ספרים (רבים)</th><th>עבודה (נקבה)</th><th>עבודות</th></tr>
   ${PERS.map(p=>`<tr><td>${p[0]}</td><td>${p[3]}</td><td><b>ספר${p[1]}</b></td><td><b>ספר${p[2]}</b></td><td><b>עבודת${p[1]}</b></td><td><b>עבודות${p[2]}</b></td></tr>`).join("")}</table>`)+
  SEC("כללים וטריקים",`${KEY("<b>רבים = י'</b> לפני הכינוי: ספרו (אחד) ← ספר<b>י</b>ו (הרבה). ספרנו ← ספר<b>י</b>נו. ספרם ← ספר<b>י</b>הם.")}
   ${KEY("<b>נקבה שמסתיימת ב-ה:</b> ה' הופכת ל-<b>ת'</b> – עבודה ← עבוד<b>ת</b>י, משפחה ← משפח<b>ת</b>נו, כיתה ← כית<b>ת</b>ם.")}
   ${KEY("<b>רבות ב-ות</b> שומרות על ה-ות: מחברות ← מחברות<b>יי</b>, מחברות<b>יו</b>, מחברות<b>ינו</b>.")}
   ${KEY("<b>את ואתה ברבים:</b> ספריך (אתה) – י' אחת; ספר<b>יי</b>ך (את) – שתי יודים. <b>אני ברבים:</b> ספריי (לפי האקדמיה – שתי יודים).")}
   ${KEY("<b>אסור לשלב</b> פרוד וחבור יחד: \"<s>ילדיהן שלהן</s>\". בוחרים אחד.")}
   ${KEY("<b>סגנון:</b> החבור גבוה ורשמי יותר (ביתנו), הפרוד יומיומי (הבית שלנו).")}`),
};

let S=null; const app=$("#app");
function stars(p){return p>=90?3:p>=70?2:p>=50?1:0;}
function home(){
  S=null; const prog=loadProg();
  let h=`<header class="top"><div><h1>מתכוננים למבחן בעברית ✍️</h1><p class="sub">כיתה ח' · הבנת הנקרא, הבעה ולשון</p></div><div class="chip-date">📅 המבחן: יום ה' 26.11</div></header>
  <div class="howto">בכל נושא: קודם <b>📘 הסבר</b> עם טבלאות וטריקים, ואז תרגול. בהבנת הנקרא – שלושה טקסטים לא מוכרים, עם כל ארבעת סוגי השאלות. בכל תשובה מופיע הסבר.</div>`;
  let g="";
  TOPICS.forEach((t,ti)=>{
    if(t.group!==g){ if(g) h+=`</div>`; g=t.group; h+=`<div class="section-title">${g}</div><div class="grid">`; }
    h+=`<div class="topic"><div class="t-head"><div class="icon">${t.icon}</div><div><h3>${t.title}</h3><p>${t.desc}</p></div></div>
     <button class="exbtn" onclick="explain(${ti})">📘 הסבר ודרכים לזכור</button><div class="levels">`;
    [0,1,2].forEach(l=>{const b=prog[t.id+"_"+l];const st=b==null?"":"★".repeat(stars(b))+"☆".repeat(3-stars(b));
      h+=`<button class="lvl l${l}" onclick="start(${ti},${l})">${(t.levelNames||LVL)[l]}<span class="stars">${st}</span></button>`;});
    h+=`</div></div>`;
  });
  const fb=prog["final_3"];
  h+=`</div><div class="section-title">🎯 לסיום</div><button class="bigbtn" onclick="start(-1,3)">🎯 מבחן מסכם – 24 שאלות מכל החומר${fb!=null?`<br><span style="font-size:15px">שיא: ${fb}%</span>`:""}</button>
  <div class="resetall"><button class="linkbtn" onclick="if(confirm('לאפס את ההתקדמות?')){saveProg({});home();}">איפוס התקדמות</button></div>`;
  app.innerHTML=h; scrollTo(0,0);
}
function explain(ti){
  const t=TOPICS[ti]; S=null;
  app.innerHTML=`<div class="qbar"><button class="back" onclick="home()">→ חזרה</button><div class="qtitle">📘 הסבר</div></div>
  <div class="ex-head"><h2>${t.icon} ${t.title}</h2></div>${EXPLAIN[t.id]()}
  <div class="ex-start">${[0,1,2].map(l=>`<button class="lvl l${l}" onclick="start(${ti},${l})">לתרגול – ${(t.levelNames||LVL)[l]}</button>`).join("")}</div>`;
  scrollTo(0,0);
}
function explainModal(){
  if(!S||S.ti<0) return; const t=S.topic; const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="inner"><div class="ex-head"><h2>📘 ${t.title}</h2><button class="btn" id="mclose">חזרה לתרגול ✕</button></div>${EXPLAIN[t.id]()}</div>`;
  m.onclick=e=>{if(e.target===m)m.remove();}; document.body.appendChild(m); $("#mclose",m).onclick=()=>m.remove();
}
function start(ti,l){ const t=ti<0?FINAL:TOPICS[ti]; S={ti,l,topic:t,qs:t.levels[l](),i:0,score:0,mistakes:[]}; S.max=S.qs.length; showQ(); }
function lvlName(){return S.ti>=0&&S.topic.levelNames?S.topic.levelNames[S.l]:LVL[S.l];}
function head(){
  const t=S.topic,pct=Math.round(S.i/S.qs.length*100);
  return `<div class="qbar"><button class="back" onclick="home()">→ חזרה</button><div class="qtitle">${t.icon} ${t.title}<span class="badge l${S.l}">${lvlName()}</span></div>${S.ti>=0?`<button class="back" onclick="explainModal()">📘 הסבר</button>`:""}</div>
  <div class="progress"><div style="width:${pct}%"></div></div>`;
}
function textHTML(i){ const T=TX[i]; return `<details class="rt" open><summary>📄 הטקסט (לחצו להסתרה/הצגה)</summary><div class="reading"><h4>${T.title}</h4><div style="font-family:Rubik;font-size:14px;color:var(--muted)">${T.kind}</div>${T.paras.map((p,k)=>`<p><span class="pn">${k+1}</span>${p}</p>`).join("")}</div></details>`; }
function showQ(){
  const q=S.qs[S.i];
  let h=head()+`<div class="card">`+(q.text!=null?textHTML(q.text):"")+`<div class="qnum">שאלה ${S.i+1} מתוך ${S.qs.length}${q.type?`<span class="qtype">${q.type}</span>`:""}</div><div class="qtext">${q.q}</div>`;
  if(q.quote) h+=`<div class="quote">${q.quote}</div>`;
  if(q.quoteBlock) h+=`<div class="quote" style="font-size:17px">${CMP_PAR[0]}</div>`;
  if(q.t==="mc"){ const o=shuffle(q.o); h+=`<div class="opts">${o.map(x=>`<button class="opt" data-v="${esc(x)}">${x}</button>`).join("")}</div>`; }
  if(q.t==="open") h+=`<textarea class="ans" id="inp" placeholder="כתבו תשובה במשפט שלם..."></textarea><div class="row"><button class="btn" id="chk">בדיקה</button></div>`;
  if(q.t==="type") h+=`<input class="ans" id="inp" autocomplete="off" placeholder="הקלידו כאן..."><div class="row"><button class="btn" id="chk">בדיקה</button></div>`;
  if(q.t==="order"){ const it=shuffle(q.items.map((s,i)=>i)); h+=`<div class="hint" style="color:var(--muted);font-size:15px;margin:-6px 0 10px">לחצו על המשפטים לפי הסדר. לחיצה על משפט שכבר נבחר מחזירה אותו.</div><div class="ozone" id="zone"></div><div class="olist" id="bank">${it.map(i=>`<button class="oitem" data-i="${i}">${q.items[i]}</button>`).join("")}</div><div class="row"><button class="btn" id="chk" disabled>בדיקה</button></div>`; }
  if(q.t==="free") h+=`<textarea class="ans" id="inp" style="min-height:220px" placeholder="כתבו כאן את הפסקה..."></textarea><div class="row"><button class="btn" id="chk">בדיקה</button></div>`;
  h+=`<div id="fb"></div></div>`; app.innerHTML=h; scrollTo(0,0); wire(q);
}
function wire(q){
  if(q.t==="mc") document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.v===q.o[0]; document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.v===q.o[0])x.classList.add("ok");}); if(!ok)b.classList.add("bad");
    finish(ok?1:0,ok?"נכון! ✔️":"לא נכון. התשובה הנכונה מסומנת בירוק.",q.ex,strip(q.q)+" ← "+strip(q.o[0]));});
  if(q.t==="open") $("#chk").onclick=()=>{
    const v=$("#inp").value.trim(); if(!v) return; $("#inp").disabled=true; $("#chk").disabled=true; const n=norm(v);
    const got=q.keys.filter(k=>k.split("|").some(a=>n.includes(norm(a)))).length; const sc=got>=q.need?1:got>0?.5:0;
    const tips=[]; if(v.split(/\s+/).length<4) tips.push("ענו במשפט שלם, שמשתמש במילים מהשאלה.");
    finish(sc,sc===1?"התשובה כוללת את המידע הנדרש ✔️":sc?"חלק מהמידע חסר.":"התשובה לא תואמת את הטקסט.",q.ex,strip(q.q)+" ← "+q.model,
      `${tips.length?`<ul>${tips.map(t=>`<li>${t}</li>`).join("")}</ul>`:""}<div class="model">✍️ תשובה לדוגמה: <b>${q.model}</b></div><div class="model" style="font-size:14px">הבדיקה האוטומטית מחפשת מילות מפתח – השוו גם בעצמכם לתשובה לדוגמה.</div>`,sc===1?"ok":sc?"warn":"bad"); };
  if(q.t==="type"){ const go=()=>{ const v=$("#inp").value; if(!v.trim()) return; $("#inp").disabled=true; $("#chk").disabled=true;
    const ok=q.a.some(a=>norm(a)===norm(v)); finish(ok?1:0,ok?"נכון! ✔️":`לא נכון. התשובה: <b>${q.a[0]}</b>`,q.ex,strip(q.q)+" ← "+q.a[0]); };
    $("#chk").onclick=go; $("#inp").onkeydown=e=>{if(e.key==="Enter")go();}; $("#inp").focus(); }
  if(q.t==="order"){ const zone=$("#zone"),bank=$("#bank"); let ord=[];
    const render=()=>{ zone.innerHTML=ord.map((i,k)=>`<button class="oitem" data-k="${k}"><span class="n">${k+1}</span>${q.items[i]}</button>`).join("");
      bank.querySelectorAll(".oitem").forEach(b=>b.classList.toggle("used",ord.includes(+b.dataset.i)));
      zone.querySelectorAll(".oitem").forEach(b=>b.onclick=()=>{ord.splice(+b.dataset.k,1);render();}); $("#chk").disabled=ord.length<q.items.length; };
    bank.querySelectorAll(".oitem").forEach(b=>b.onclick=()=>{ord.push(+b.dataset.i);render();});
    $("#chk").onclick=()=>{ $("#chk").disabled=true; let ok=0; zone.querySelectorAll(".oitem").forEach((b,k)=>{b.onclick=null; const g=ord[k]===k; b.classList.add(g?"ok":"bad"); if(g) ok++;});
      const sc=ok===q.items.length?1:ok/q.items.length; finish(sc,sc===1?"הסדר מושלם! ✔️":`${ok} מתוך ${q.items.length} במקום הנכון.`,q.ex,"סדר הפסקה",
       sc<1?`<div class="model">הסדר הנכון:<ol>${q.items.map(s=>`<li>${s}</li>`).join("")}</ol></div>`:"",sc===1?"ok":"warn"); }; render(); }
  if(q.t==="free") $("#chk").onclick=()=>{ const v=$("#inp").value.trim(); if(!v) return; const words=v.split(/\s+/).length;
    const checks=[...q.checks.map(([re,l])=>[new RegExp(re).test(v),l]),[words>=q.minWords,`אורך: ${words} מילים (מומלץ לפחות ${q.minWords})`]];
    const pass=checks.filter(c=>c[0]).length, sc=pass===checks.length?1:pass>=checks.length-2?.5:0;
    finish(sc,sc===1?"כל רכיבי המבנה נמצאים בפסקה ✔️":"כמעט – בדקו מה חסר:",null,null,`<ul>${checks.map(c=>`<li>${c[0]?"✅":"❌"} ${c[1]}</li>`).join("")}</ul><div class="model">✍️ פסקה לדוגמה: ${q.model}</div><div class="model" style="font-size:14px">הבדיקה בודקת את המבנה בלבד – כדאי לבקש ממבוגר לקרוא גם את התוכן.</div>`,sc===1?"ok":"warn"); };
}
function strip(s){return String(s).replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();}
function finish(pts,msg,ex,review,extra="",cls){
  S.score+=pts; if(pts<1&&review) S.mistakes.push(review);
  const last=S.i===S.qs.length-1;
  $("#fb").innerHTML=`<div class="fb ${cls||(pts>=1?"ok":"bad")}"><b>${msg}</b>${ex?`<div class="model">💡 ${ex}</div>`:""}${extra}</div>
  <div class="row"><button class="btn" id="next">${last?"לסיכום 🏁":"הבא ←"}</button></div>`;
  const nx=$("#next"); nx.onclick=next; setTimeout(()=>nx.focus({preventScroll:true}),50);
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){S.i++; if(S.i<S.qs.length) showQ(); else summary();}
function summary(){
  const pct=Math.round(S.score/S.max*100),st=stars(pct); const prog=loadProg(),key=S.topic.id+"_"+S.l;
  if(prog[key]==null||pct>prog[key]){prog[key]=pct;saveProg(prog);}
  const msg=pct>=90?"מעולה! את/ה מוכנ/ה! 🏆":pct>=70?"יפה מאוד! עוד קצת תרגול ⭐":pct>=50?"התחלה טובה – נסו שוב 💪":"כדאי לחזור על ההסבר ולנסות שוב 📘";
  const nextL=S.ti>=0&&S.l<2&&pct>=70?`<button class="btn" onclick="start(${S.ti},${S.l+1})">ל${S.topic.levelNames?S.topic.levelNames[S.l+1]:"שלב ה"+LVL[S.l+1]} ←</button>`:"";
  app.innerHTML=`<div class="qbar"><button class="back" onclick="home()">→ חזרה</button><div class="qtitle">${S.topic.icon} ${S.topic.title}<span class="badge l${S.l}">${lvlName()}</span></div></div>
  <div class="card sum"><div class="bigstars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><div class="score">${pct}%</div><div style="font-size:20px;font-weight:700">${msg}</div>
  <div class="row" style="justify-content:center;margin-top:18px">${nextL}<button class="btn ghost" onclick="start(${S.ti},${S.l})">שוב 🔁</button><button class="btn ghost" onclick="home()">לכל הנושאים</button></div>
  ${S.mistakes.length?`<div class="mist"><h4>כדאי לחזור על:</h4><ul>${S.mistakes.map(m=>`<li>${m}</li>`).join("")}</ul></div>`:""}</div>`;
  scrollTo(0,0);
}
home();
</script>
